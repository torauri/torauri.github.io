<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>テレポシミュ - 矢印パターンマッチングゲーム</title>
    <meta name="description" content="画面上部に表示される矢印パターンに対応する2つのマスを5x5グリッドから探してタップする脳トレゲーム。スマホ対応、エンドレスモード搭載。">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css?v=1.0.2">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1 class="app-title">テレポシミュ</h1>
            <p class="app-subtitle">矢印パターンに対応する2つのマスをタップ！</p>
        </header>

        <!-- Stats Board -->
        <section class="stats-board">
            <div class="stat-card correct">
                <span class="stat-label">正解</span>
                <span class="stat-value" id="correct-count">0</span>
            </div>
            <div class="stat-card incorrect">
                <span class="stat-label">不正解</span>
                <span class="stat-value" id="incorrect-count">0</span>
            </div>
            <div class="stat-card streak">
                <span class="stat-label">連勝</span>
                <span class="stat-value" id="streak-count">0</span>
            </div>
            <div class="stat-card accuracy">
                <span class="stat-label">正解率</span>
                <span class="stat-value" id="accuracy-value">0%</span>
            </div>
        </section>

        <!-- Pattern Display Area -->
        <main class="game-main">
            <div class="pattern-container">
                <div class="pattern-header">
                    <span class="pattern-title" id="pattern-name">パターン読み込み中...</span>
                </div>
                <div class="arrows-display" id="arrows-display">
                    <!-- Arrows will be rendered dynamically by JavaScript -->
                    <div class="arrow-placeholder"></div>
                    <div class="arrow-placeholder"></div>
                </div>
            </div>

            <!-- Validation Message -->
            <div class="message-display" id="message-display">
                <span id="message-text">マスを2つ順番に選んでください</span>
            </div>

            <!-- 5x5 Interactive Grid Container -->
            <div class="grid-wrapper">
                <div class="game-grid" id="game-grid">
                    <!-- Generated by JavaScript with labels -->
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="control-panel">
                <button class="btn btn-secondary" id="btn-skip">スキップ</button>
                <button class="btn btn-danger" id="btn-reset">リセット</button>
                <button class="btn btn-warning" id="btn-show-answer">正解表示</button>
            </div>
        </main>

        <!-- Footer (Instructions) -->
        <footer class="app-footer">
            <div class="instructions-card">
                <h3>遊び方</h3>
                <ul>
                    <li>上部の矢印パターンに対応する<strong>正解の2マス</strong>を順番に押します。</li>
                    <li><strong>[右右]</strong>のように方向が同じ場合は、<strong>順不同</strong>で正解になります。</li>
                    <li><strong>[右下]</strong>のように方向が異なる場合は、<strong>順番通り</strong>に押す必要があります。</li>
                    <li>選択したマスを<strong>もう一度タップするとキャンセル（選択解除）</strong>できます。</li>
                </ul>
            </div>
            <div class="version-display">v1.0.0</div>
        </footer>
    </div>

    <!-- Notification Toast for CSV status -->
    <div class="toast" id="toast-message">CSVデータを読み込みました</div>

    <!-- JavaScript -->
    <script src="app.js?v=1.0.2"></script>
</body>
</html>
